name: Publish
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: node -e 'const p=require("./package.json"), l=require("./package-lock.json"); if(p.version!==l.version || p.version!==l.packages[""].version || p.name!==l.name) process.exit(1)'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/*.test.cjs
      - name: Pack
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: n8n-nodes-openclaw-weixin-*.tgz
          if-no-files-found: error
      - run: npm publish ./n8n-nodes-openclaw-weixin-${GITHUB_REF_NAME#v}.tgz --registry=https://registry.npmjs.org --access=public --tag=latest --provenance
